name: CI

# Never add auto workflow runs of any type.
# Workflows must always be manually triggered.
on:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.4'
          elixir-version: '1.20.2'
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix check.full
      - name: Build OTP release
        env:
          MIX_ENV: prod
        run: mix release.build
      - name: Emit release metadata
        env:
          VIAL_KEEPER_ROOT: ${{ runner.temp }}/vialkeeper-root
          MIX_ENV: prod
        run: |
          mkdir -p artifacts "$VIAL_KEEPER_ROOT"
          bin=_build/prod/rel/vial_keeper/bin/vial_keeper
          "$bin" eval 'IO.inspect(VialKeeper.Diagnostics.runtime(), pretty: true)' > artifacts/release-metadata.txt
          "$bin" eval 'IO.puts(:erlang.iolist_to_binary(JSON.encode_to_iodata!(VialKeeper.Diagnostics.runtime())))' > artifacts/release-metadata.json || printf '{"error":"release metadata JSON encoding failed"}\n' > artifacts/release-metadata.json
      - name: Upload release metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: artifacts/
      - name: Upload OTP release
        uses: actions/upload-artifact@v4
        with:
          name: vialkeeper-release
          path: _build/prod/rel/vial_keeper
